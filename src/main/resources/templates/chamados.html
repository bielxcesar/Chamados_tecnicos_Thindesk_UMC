<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}">
<title>Chamados | Thindesk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-4">
<nav class="d-flex justify-content-between mb-4"><a th:href="@{/}">Thindesk • Início</a><form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Sair</button></form></nav>
<h1>Chamados técnicos</h1><p>Consulte seus chamados e acompanhe as soluções.</p>
<div id="mensagem" role="status" aria-live="polite"></div>
<section class="card p-4 mb-4"><h2 class="h4">Abrir chamado</h2>
<form id="abrir"><label class="form-label" for="titulo">Título</label><input id="titulo" name="titulo" class="form-control mb-3" required maxlength="150">
<label class="form-label" for="descricao">Descrição do problema</label><textarea id="descricao" name="descricao" class="form-control mb-3" required maxlength="5000"></textarea>
<label class="form-label" for="tipo">Tipo</label><input id="tipo" name="tipo" class="form-control mb-3" required maxlength="80" placeholder="Ex.: Hardware, Software, Rede">
<button class="btn btn-primary">Abrir chamado</button></form></section>
<div class="table-responsive"><table class="table bg-white"><thead><tr><th>Título</th><th>Descrição</th><th>Status</th><th>Usuário</th><th>Técnico</th><th>Solução</th><th>Ação</th></tr></thead>
<tbody><tr th:if="${#lists.isEmpty(chamados)}"><td colspan="7">Nenhum chamado encontrado.</td></tr>
<tr th:each="c : ${chamados}"><td th:text="${c.titulo}"></td><td th:text="${c.descricao}"></td><td th:text="${c.status}"></td><td th:text="${c.usuario}"></td><td th:text="${c.tecnico}"></td><td th:text="${c.solucao}"></td>
<td><button th:if="${podeResolver and c.status != 'RESOLVIDO' and (c.tecnico == null or c.tecnico == login)}" type="button" class="btn btn-success btn-sm resolver" th:attr="data-id=${c.id}">Resolver</button></td></tr></tbody></table></div>
<dialog id="resolucao"><form id="resolver"><h2 class="h4">Resolver chamado</h2><label for="solucao">Solução aplicada</label><textarea id="solucao" name="solucao" class="form-control mb-3" required maxlength="5000"></textarea><button class="btn btn-success">Confirmar resolução</button><button type="button" id="fechar" class="btn btn-secondary">Cancelar</button></form></dialog>
</main><script th:src="@{/js/chamados.js}"></script></body></html>
